name: Tests

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.py.tftpl'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - '**.py'
      - '**.py.tftpl'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: make install-dev

      - name: Run tests
        run: make test
